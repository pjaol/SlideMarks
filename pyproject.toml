[project]
name = "slidemarks-build"
version = "0.0.1"
description = "SlideMarks font build pipeline and review specimens"
requires-python = ">=3.11"
dependencies = [
  "fonttools[woff]>=4.55",
  "skia-pathops>=0.8",
  "python-pptx>=1.0",
  "python-docx>=1.2.0",
]

[project.scripts]
slidemarks = "slidemarks_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidemarks_build"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
