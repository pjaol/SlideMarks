    (function () {
      const $ = (id) => document.getElementById(id);
      const root = $("root");
      const GLYPH = ["", "", "", "", "", "", "", "", "", ""];
      // when each cell gets its symbol: the inserted one first, then the rest typed in
      const appear = [3.0, 3.15, 3.3, 2.45, 3.45, 3.6, 3.75, 3.9, 4.05, 4.2];
      const ext = " (EU and UK regions, customer-managed keys)";
      const alignX = { left: 633, center: 672, right: 711 }; // ribbon highlight x per align button
      const step = (t, marks, values) => values[marks.filter((m) => t >= m).length];

      const tl = gsap.timeline({ paused: true });

      // workspace arrives; the pane opens from the right
      tl.fromTo(["#d-ribbon", "#d-card"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 0);
      tl.fromTo("#d-pane", { x: 520 }, { x: 0, duration: 0.55, ease: "expo.out" }, 0.1);

      // cursor: pick Harvey ball 0 %, then Insert into PowerPoint
      const click = (at) => tl.to("#d-cursor", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, at);
      const go = (x, y, at, d = 0.45) => tl.to("#d-cursor", { x: x - 3, y: y - 3, duration: d, ease: "power3.inOut" }, at);
      tl.fromTo("#d-cursor", { x: 1700, y: 1150, opacity: 1 }, { x: 1700, y: 1150, duration: 0.01 }, 0);
      go(1412, 473, 0.7, 0.7); click(1.5);
      go(1560, 963, 1.75); click(2.35);
      go(1180, 720, 2.6, 0.5);
      // align: left, right, centre
      go(651, 117, 7.45); click(8.0);
      go(729, 117, 8.2, 0.35); click(8.6);
      go(690, 117, 8.8, 0.35); click(9.2);
      // size up three times, down twice
      go(483, 70, 9.7); click(10.3); click(10.6); click(10.9);
      go(526, 70, 11.15, 0.25); click(11.5); click(11.8);
      // select the SSO row, then B, I, U
      go(150, 420, 12.05, 0.35); go(1290, 420, 12.45, 0.35);
      go(139, 117, 12.75); click(13.1);
      go(178, 117, 13.35, 0.2); click(13.6);
      go(215, 117, 13.85, 0.2); click(14.1);
      // Product A column, then font colour
      go(900, 300, 14.35, 0.3); go(900, 700, 14.65, 0.25);
      go(565, 117, 14.95, 0.3); click(15.3);
      tl.to("#d-cursor", { opacity: 0, duration: 0.2 }, 15.65);

      ["#d-cap1", "#d-cap2", "#d-cap3", "#d-cap4", "#d-cap5"].forEach((c, n) =>
        tl.fromTo(`${c} span`, { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, [0.4, 4.5, 7.3, 9.8, 12.4][n]));

      const render = () => {
        const t = tl.time();
        GLYPH.forEach((g, k) => { $(`d-g${k}`).textContent = t >= appear[k] ? g : ""; });
        const p = Math.min(Math.max((t - 4.7) / 1.5, 0), 1);
        $("d-ext").textContent = ext.slice(0, Math.round(p * ext.length));

        const align = step(t, [8.0, 8.6, 9.2], ["center", "left", "right", "center"]);
        document.querySelectorAll("#root td.gc").forEach((td) => { td.style.textAlign = align; });
        const cols = t >= 7.9 && t < 9.5; // product cells selected while aligning
        document.querySelectorAll("#root td.gc").forEach((td) => td.classList.toggle("sel", cols || (t >= 14.6 && t < 15.55 && td.classList.contains("ca"))));
        $("d-al").style.left = alignX[align] + "px";
        $("d-al").style.top = "59px";
        $("d-al").style.opacity = cols ? 1 : 0;

        const pt = step(t, [10.3, 10.6, 10.9, 11.5, 11.8], [28, 32, 36, 40, 36, 32]);
        root.style.setProperty("--gs", (pt * 44) / 28 + "px");
        $("d-size").textContent = pt;
        $("d-size").style.opacity = t >= 10.0 && t < 12.2 ? 1 : 0;

        const sso = $("d-sso");
        const rowSel = t >= 12.5 && t < 14.35;
        sso.classList.toggle("sel", rowSel);
        sso.classList.toggle("b", t >= 13.1);
        sso.classList.toggle("i", t >= 13.6);
        sso.classList.toggle("u", t >= 14.1);
        $("d-hb").style.opacity = rowSel && t >= 13.1 ? 1 : 0;
        $("d-hi").style.opacity = rowSel && t >= 13.6 ? 1 : 0;
        $("d-hu").style.opacity = rowSel && t >= 14.1 ? 1 : 0;

        document.querySelectorAll("#root .ga").forEach((g) => { g.style.color = t >= 15.3 ? "#6d3b8e" : "#1f2328"; });
      };
      tl.eventCallback("onUpdate", render);
      tl.set({}, {}, 16);
      render();
      window.__timelines["demo"] = tl;
    })();
