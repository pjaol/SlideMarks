<template>
  <style>
    @font-face {
      font-family: "SlideMarks";
      src: url("assets/fonts/SlideMarks-Regular.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Inter, sans-serif;
      color: #1f2328;
    }
    #e-lock {
      position: absolute;
      left: 0;
      right: 0;
      top: 330px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
    }
    #e-mark {
      font-family: "SlideMarks";
      font-size: 220px;
      line-height: 1;
      color: #9b5cc8;
      transform: translateY(19px);
    }
    #e-word {
      font-size: 128px;
      font-weight: 800;
      letter-spacing: -0.035em;
    }
    #e-sub {
      position: absolute;
      left: 0;
      right: 0;
      top: 600px;
      text-align: center;
      font-size: 52px;
      font-weight: 600;
    }
    #e-url {
      position: absolute;
      left: 0;
      right: 0;
      top: 690px;
      text-align: center;
      font-size: 40px;
      font-weight: 600;
      color: #6d3b8e;
    }
  </style>
  <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
    <div id="e-lock">
      <div id="e-mark">&#xE000;</div>
      <div id="e-word">SlideMarks</div>
    </div>
    <div id="e-sub">Free for Word and PowerPoint</div>
    <div id="e-url">pjaol.github.io/SlideMarks</div>
  </div>
  <script>
    (function () {
      const steps = ["", "", "", "", "", "", "", "", "", ""];
      const mark = document.getElementById("e-mark");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#e-mark", { x: 360 }, { x: 0, duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#e-word", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.75);
      tl.fromTo("#e-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 1.3);
      tl.fromTo("#e-url", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 1.55);
      const render = () => {
        const p = Math.min(Math.max((tl.time() - 0.15) / 0.6, 0), 1);
        mark.textContent = steps[Math.round(p * (steps.length - 1))];
      };
      tl.eventCallback("onUpdate", render);
      tl.set({}, {}, 4.5);
      window.__timelines["end"] = tl;
    })();
  </script>
</template>
