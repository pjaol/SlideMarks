    <div id="i-cap1" class="cap clip" data-start="0.4" data-duration="1.7" data-track-index="2"><span>Add</span> <span>an</span> <span>icon.</span> <span>Type.</span></div>
    <div id="i-cap2" class="cap clip" data-start="2.1" data-duration="0.85" data-track-index="2"><span>It's</span> <span class="hl">hidden.</span></div>
    <div id="i-cap3" class="cap clip" data-start="2.95" data-duration="1.15" data-track-index="2"><span>Space.</span> <span>Drag.</span> <span>Nudge.</span></div>
    <div id="i-cap4" class="cap clip" data-start="4.1" data-duration="2.9" data-track-index="2"><span>Click.</span> <span>Type.</span> <span class="hl">Done.</span></div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const words = "Fully compliant";
      const clamp01 = (v) => Math.min(Math.max(v, 0), 1);
      const tl = gsap.timeline({ paused: true });

      const click = (at) => tl.to("#i-cursor", { scale: 0.82, duration: 0.07, yoyo: true, repeat: 1 }, at);
      const go = (x, y, at, d = 0.4) => tl.to("#i-cursor", { x: x - 3, y: y - 3, duration: d, ease: "power3.inOut" }, at);

      // top: the picture lands at the start of the text box; typing runs underneath it
      tl.fromTo("#i-ic", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 0.3);
      tl.fromTo("#i-cursor", { x: 1100, y: 900 }, { x: 1100, y: 900, duration: 0.01 }, 0);
      go(205, 270, 0.55); click(0.9);
      tl.to("#i-cursor", { opacity: 0, duration: 0.1 }, 1.0);
      // the fix: spaces push the words right, then the picture is dragged into the gap and nudged
      tl.to("#i-cursor", { opacity: 1, x: 205 - 3, y: 275 - 3, duration: 0.1 }, 3.35);
      tl.to("#i-hdl", { opacity: 1, duration: 0.01 }, 3.4);
      tl.to("#i-ic", { x: 30, y: 4, duration: 0.25, ease: "power3.inOut" }, 3.45);
      tl.to("#i-cursor", { x: 235 - 3, y: 279 - 3, duration: 0.25, ease: "power3.inOut" }, 3.45);
      tl.to("#i-ic", { x: 24, duration: 0.05 }, 3.75);
      tl.to("#i-ic", { y: 1, duration: 0.05 }, 3.85);
      tl.to("#i-ic", { x: 20, duration: 0.05 }, 3.95);
      tl.to("#i-hdl", { opacity: 0, duration: 0.01 }, 4.05);

      // bottom: click in the box, pick a symbol in the pane, insert, type
      tl.fromTo("#i-sm", { opacity: 0.35 }, { opacity: 1, duration: 0.2 }, 4.0);
      go(205, 620, 4.05, 0.35); click(4.45);
      go(1689, 473, 4.6, 0.4); click(5.05);
      go(1560, 963, 5.15, 0.3); click(5.5);
      tl.to("#i-cursor", { x: 1250, y: 760, duration: 0.4, ease: "power3.inOut" }, 5.65);

      ["#i-cap1", "#i-cap2", "#i-cap3", "#i-cap4"].forEach((c, n) =>
        tl.fromTo(`${c} span`, { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, [0.4, 2.1, 2.95, 4.1][n]));

      tl.set("#i-hdl", { opacity: 1 }, 0);
      tl.set("#i-hdl", { opacity: 0 }, 0.7);

      const render = () => {
        const t = tl.time();
        const typed = words.slice(0, Math.round(clamp01((t - 1.1) / 0.9) * words.length));
        const spaces = " ".repeat(Math.round(clamp01((t - 3.0) / 0.35) * 6));
        $("i-pic-text").textContent = spaces + typed;
        $("i-pic-caret").style.opacity = t >= 0.95 && t < 4.0 && Math.floor(t * 4) % 2 === 0 ? 1 : 0;

        $("i-sm-g").textContent = t >= 5.55 ? "" : "";
        $("i-sm-text").textContent = (t >= 5.55 ? " " : "") + words.slice(0, Math.round(clamp01((t - 5.75) / 0.8) * words.length));
        $("i-sm-caret").style.opacity = t >= 4.5 && Math.floor(t * 4) % 2 === 0 ? 1 : 0;
      };
      tl.eventCallback("onUpdate", render);
      tl.set({}, {}, 7);
      render();
      window.__timelines["inline"] = tl;
    })();
  </script>
